<style>
/* Layout: phone-first game app. Home = level card + grid of colourful mode tiles; each mode = one big card with chunky answer buttons. Night-sky ink with coral, lime and sky accents. */
:root {
  --bg: #F6F3EE; --bg2: #ECE7DF; --card: #FFFFFF; --ink: #1F1D24; --soft: #625D6B; --line: #DDD6CC;

  --bad: #C2413A; --bad-bg: #FBE3DF;
  --display: 'Space Grotesk', Arial, sans-serif; --text: 'Inter', Arial, sans-serif;
  --shadow: 0 6px 0 rgba(31, 29, 36, 0.12);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #16141C; --bg2: #201D28; --card: #26222F; --ink: #F4F1FA; --soft: #B5AEC2; --line: #39344A;
  --coral: #FF7A59; --coral-ink: #1A1520; --lime: #B8E86A; --lime-bg: #2A3A1C; --sky: #6EC8FF; --violet: #B49BFF; --sun: #FFC94D;
  --bad: #FF8A7A; --bad-bg: #3E2226; --shadow: 0 6px 0 rgba(0, 0, 0, 0.35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #16141C; --bg2: #201D28; --card: #26222F; --ink: #F4F1FA; --soft: #B5AEC2; --line: #39344A;
  --coral: #FF7A59; --coral-ink: #1A1520; --lime: #B8E86A; --lime-bg: #2A3A1C; --sky: #6EC8FF; --violet: #B49BFF; --sun: #FFC94D;
  --bad: #FF8A7A; --bad-bg: #3E2226; --shadow: 0 6px 0 rgba(0, 0, 0, 0.35); color-scheme: dark; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--text); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 28px; }
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; border-radius: 16px; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
.top { display: flex; align-items: center; gap: 12px; }
.logo { width: 44px; height: 44px; flex: none; }
.brand { min-width: 0; flex: 1; }
.brand h1 { font-family: var(--display); font-size: 22px; margin: 0; line-height: 1.1; letter-spacing: -0.3px; }
.brand .unit { color: var(--soft); font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip svg { width: 20px; height: 20px; }
.hero { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 18px; display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; box-shadow: var(--shadow); }
.ring { width: 92px; height: 92px; position: relative; }
.ring svg { width: 92px; height: 92px; transform: rotate(-90deg); }
.ring .num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1; }
.ring .num small { font-family: var(--text); font-weight: 500; font-size: 11px; color: var(--soft); margin-top: 3px; }
.lvl { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.lvl .name { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.1; }
.lvl .meta { color: var(--soft); font-size: 14px; }
.xpbar { height: 12px; background: var(--bg2); border-radius: 99px; overflow: hidden; }

.stats { display: flex; gap: 8px; flex-wrap: wrap; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

.tile { background: var(--card); border: 1px solid var(--line); text-align: left; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-height: 132px; box-shadow: var(--shadow); transition: transform .12s ease; }
.tile:hover { transform: translateY(-3px); }
.tile:active { transform: translateY(2px); box-shadow: none; }
.tile .ic { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #FFFFFF; }
.tile .ic svg { width: 26px; height: 26px; }
.tile b { font-family: var(--display); font-size: 18px; line-height: 1.15; }
.tile span { color: var(--soft); font-size: 13px; }
#app { display: flex; flex-direction: column; gap: 14px; }
.tile.wide { width: 100%; flex-direction: row; align-items: center; min-height: 0; }
.tile.wide .txt { display: flex; flex-direction: column; gap: 2px; }
.tile.wide .txt b { color: var(--ink); }
.sec { font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--soft); margin: 4px 2px -4px; }
.play { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: clamp(16px, 4vw, 28px); display: flex; flex-direction: column; gap: 16px; min-height: 380px; box-shadow: var(--shadow); }
.playtop { display: flex; align-items: center; gap: 10px; }
.back { background: var(--bg2); width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; flex: none; }
.back svg { width: 22px; height: 22px; }
.mode { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: 1px; text-transform: uppercase; color: var(--coral); flex: 1; min-width: 0; }
.prompt { font-family: var(--display); font-weight: 700; font-size: clamp(26px, 6vw, 38px); line-height: 1.15; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.note { color: var(--soft); margin: 0; font-size: 15px; }
.answers { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.ans { background: var(--bg2); border: 2px solid var(--line); padding: 16px 18px; text-align: left; font-size: 18px; font-weight: 600; box-shadow: 0 4px 0 var(--line); transition: transform .1s; }
.ans:hover:not(:disabled) { border-color: var(--coral); }
.ans:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }
.ans.right { background: var(--lime-bg); border-color: var(--lime); box-shadow: 0 4px 0 var(--lime); }
.ans.wrong { background: var(--bad-bg); border-color: var(--bad); box-shadow: 0 4px 0 var(--bad); }
.ans:disabled { cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { background: var(--bg2); padding: 13px 18px; font-weight: 700; box-shadow: 0 4px 0 var(--line); }
.btn:active { transform: translateY(3px); box-shadow: none; }
.btn.go { background: var(--coral); color: var(--coral-ink); box-shadow: 0 4px 0 color-mix(in srgb, var(--coral) 60%, #000); }
.btn.yes { background: var(--lime); color: #15210A; box-shadow: 0 4px 0 color-mix(in srgb, var(--lime) 60%, #000); }
.btn.no { background: var(--bad); color: #FFFFFF; box-shadow: 0 4px 0 color-mix(in srgb, var(--bad) 60%, #000); }
.btn.small { padding: 8px 12px; font-size: 14px; }
.inp { flex: 1 1 220px; min-width: 0; font-size: 22px; padding: 14px 16px; border: 2px solid var(--line); border-radius: 16px; background: var(--bg); }
.fb { border-radius: 16px; padding: 14px 16px; font-size: 16px; display: flex; gap: 12px; align-items: flex-start; }
.fb svg { width: 26px; height: 26px; flex: none; }
.fb.ok { background: var(--lime-bg); }
.fb.ok svg { color: var(--lime); }
.fb.no { background: var(--bad-bg); }
.fb.no svg { color: var(--bad); }
.fb b { font-family: var(--display); font-size: 18px; }
.fb .xp { color: var(--soft); font-size: 14px; }
.flash { background: linear-gradient(135deg, var(--violet), var(--sky)); color: #FFFFFF; border-radius: 22px; min-height: 220px; padding: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; width: 100%; box-shadow: var(--shadow); }
.flash .prompt { color: #FFFFFF; font-size: clamp(28px, 7vw, 44px); }
.flash .note { color: rgba(255, 255, 255, 0.88); }
.speak { background: rgba(255, 255, 255, 0.18); color: #FFFFFF; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; }
.speak svg { width: 22px; height: 22px; }
.spacer { flex: 1; }
.timer { height: 14px; background: var(--bg2); border-radius: 99px; overflow: hidden; }

.big { font-family: var(--display); font-weight: 700; font-size: 64px; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; }
.center { text-align: center; }
.list { width: 100%; border-collapse: collapse; font-size: 15px; }
.list td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.list td:first-child { font-weight: 700; }
.tablewrap { overflow-x: auto; }
.dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.foot { color: var(--soft); font-size: 13px; text-align: center; }
.confirm { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
.pop { animation: pop .35s ease; }
@keyframes pop { 0% { transform: scale(.96); } 60% { transform: scale(1.03); } 100% { transform: scale(1); } }
.shake { animation: shake .35s ease; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.join .jhead { display: flex; gap: 14px; align-items: center; }
.join .jhead .ic { width: 52px; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #FFFFFF; flex: none; }
.join .jhead .ic svg { width: 30px; height: 30px; }
.join .jhead b { display: block; font-family: var(--display); font-size: 22px; line-height: 1.15; }
.join .jhead span { color: var(--soft); font-size: 14px; }
.fld { display: flex; flex-direction: column; gap: 6px; }
.fld > span { font-weight: 700; font-size: 14px; color: var(--soft); }
.fld .inp { flex: none; width: 100%; font-size: 20px; color: var(--ink); }
.fld .inp.pin { letter-spacing: 8px; max-width: 200px; }
.tabs { display: flex; gap: 4px; background: var(--bg2); padding: 5px; border-radius: 16px; overflow-x: auto; }
.tab { flex: 1 1 0; min-width: max-content; background: transparent; padding: 9px 8px; font-weight: 700; font-size: 13px; color: var(--soft); border-radius: 12px; white-space: nowrap; }
.tab.on { background: var(--card); color: var(--ink); box-shadow: 0 2px 0 var(--line); }
.who { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; width: 100%; }
.rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.rank li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; background: var(--bg); border: 1px solid var(--line); flex-wrap: wrap; }
.rank li.note { border: 0; background: none; }
.rank li.me { background: var(--lime-bg); border-color: var(--lime); }
.rank .pl { width: 34px; height: 34px; border-radius: 50%; background: var(--bg2); display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 700; flex: none; font-variant-numeric: tabular-nums; }
.rank .pl.m1 { background: #E8B526; color: #2B1E00; }
.rank .pl.m2 { background: #B9BEC8; color: #1F232B; }
.rank .pl.m3 { background: #C9814A; color: #2A1608; }
.rank .nm { flex: 1; min-width: 0; font-weight: 700; overflow-wrap: anywhere; }
.rank .nm small { font-weight: 500; color: var(--soft); }
.rank .vl { font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rank .tt { display: flex; gap: 6px; width: 100%; justify-content: flex-end; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
@media (prefers-reduced-motion: reduce) { .pop, .shake { animation: none; } .tile, .xpbar i, .timer i { transition: none; } }
</style>

 ["The Romans built a huge ___ with roads across Europe.", "empire", "empire"],
 ["Drink enough water on hot days, or you can get ___.", "dehydration", "dehydration"],
 ["The number of visitors could ___ ten million this year.", "exceed", "exceed sth."],
 ["Cheap flights ___ many people to travel abroad.", "enable", "enable sb. to do sth."],
 ["___ from the weather, our holiday was perfect.", "Apart", "apart from"],
 ["The hotel has great ___: a pool, a gym and a spa.", "facilities", "facilities"],
 ["Thomas Cook was a ___ of package holidays.", "pioneer", "pioneer"]
];

const UNIT = "Tourism";
const KEY = "app-10c-v1";
const LEVELS = ["Tourist", "Backpacker", "Explorer", "Pioneer", "Globetrotter", "Legend"];
const XP_PER_LEVEL = 200;
const DAILY_GOAL = 20;

const ICONS = {

const svg = (name, extra = "") => `<svg viewBox="0 0 24 24" aria-hidden="true" ${extra}>${ICONS[name]}</svg>`;

const MODES = [
  { id: "cards", name: "Flashcards", sub: "flip and remember · no XP", color: "var(--violet)" },
  { id: "quiz", name: "Quiz", sub: "pick the right answer · 5 XP", color: "var(--sky)" },
  { id: "type", name: "Type it", sub: "spell the word · 15 XP", color: "var(--coral)" },
  { id: "synant", name: "Synonyms & opposites", sub: "same or different? · 8 XP", color: "var(--sun)" },
  { id: "family", name: "Word families", sub: "noun, verb, adjective · 20 XP", color: "var(--lime)" },
  { id: "coll", name: "Collocations", sub: "words that go together · 8 XP", color: "var(--violet)" },
  { id: "gaps", name: "Sentences", sub: "fill the gap · 15 XP", color: "var(--sky)" },
  { id: "list", name: "Word list", sub: "all words and your status", color: "var(--soft)" }
];

let st = load();
function load() {
  const base = { lvl: {}, xp: 0, best: 0, dir: "en", today: "", done: 0, days: 0, last: "", wk: "", wxp: 0, resetSeen: 0 };
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.lvl) return Object.assign(base, s); } catch (e) {}
  return base;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} try { scheduleSync(); } catch (e) {} }
function dayStr(d = new Date()) { return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
(function checkDay() {
  const t = dayStr();
  if (st.today !== t) { st.today = t; st.done = 0; save(); }
})();

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const rnd = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => String(s).toLowerCase().replace(/\(.*?\)/g, " ").replace(/\b(sth|sb)\./g, " ").replace(/\bto do\b/g, " ").replace(/[^a-z\s-]/g, " ").replace(/\s+/g, " ").trim();
const plain = en => en.replace(/\s*\((.*?)\)/g, "").replace(/\s+(sth|sb)\./g, "").replace(" to do", "").trim();
const level = w => st.lvl[w.en] || 0;

let combo = 0, mode = "home", speed = null;

function pickWord(list = WORDS) {
  const pool = [];
  list.forEach(w => { const n = [4, 3, 2, 1][level(w)]; for (let i = 0; i < n; i++) pool.push(w); });
  return rnd(pool);
}
function award(en, ok, xp, rank = true) {
  const w = WORDS.find(x => x.en === en);
  if (w) { const l = level(w); st.lvl[en] = ok ? Math.min(3, l + 1) : Math.max(1, l - 1); }
  if (ok) {
    combo++;
    const t = dayStr();
    if (rank) addXP(xp);
    if (rank && st.last !== t) { const y = new Date(); y.setDate(y.getDate() - 1); st.days = st.last === dayStr(y) ? st.days + 1 : 1; st.last = t; }
    if (combo % 5 === 0) confetti();
  } else combo = 0;
  st.done++; save(); drawTop();
}
function drawTop() { $("days").textContent = st.days; $("unitName").textContent = "Vokabel App · Unit: " + UNIT; }

function speak(text) {
  try { const u = new SpeechSynthesisUtterance(plain(text)); u.lang = "en-GB"; u.rate = 0.9; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}

// ---------- home ----------
function home() {
  mode = "home"; stopSpeed(); offRank();
  const lv = Math.min(LEVELS.length - 1, Math.floor(st.xp / XP_PER_LEVEL)), inLv = st.xp - lv * XP_PER_LEVEL;
  const known = WORDS.filter(w => level(w) === 3).length;
  const goal = Math.min(1, st.done / DAILY_GOAL), C = 2 * Math.PI * 40;
  $("app").innerHTML = `
    <section class="hero" aria-label="Your progress">
      <div class="ring"><svg viewBox="0 0 92 92"><circle cx="46" cy="46" r="40" fill="none" stroke="var(--bg2)" stroke-width="10"/>
        <circle cx="46" cy="46" r="40" fill="none" stroke="var(--lime)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - goal)}"/></svg>
        <div class="num">${Math.min(st.done, DAILY_GOAL)}/${DAILY_GOAL}<small>today</small></div></div>
      <div class="lvl"><div class="meta">Level ${lv + 1}</div><div class="name">${LEVELS[lv]}</div>
        <div class="xpbar" aria-label="XP"><i style="width:${lv === LEVELS.length - 1 ? 100 : inLv / XP_PER_LEVEL * 100}%"></i></div>
        <div class="stats"><span class="chip">${st.xp} XP</span><span class="chip">${known}/${WORDS.length} words</span><span class="chip">Best speed: ${st.best}</span></div></div>
    </section>
    <button class="tile wide" type="button" id="goSpeed"><span class="ic" style="background:var(--coral)">${svg("speed")}</span><span class="txt"><b>Speed round</b><span>60 seconds · 2 XP per answer · record +10 XP</span></span></button>
    <button class="tile wide" type="button" id="goRank"><span class="ic" style="background:var(--sun)">${svg("trophy")}</span><span class="txt"><b>Ranking</b><span>${me ? "See where you are in the 10c" : "Sign in and compete with the 10c"}</span></span></button>
    <div class="sec">Practise</div>
    <div class="grid" id="tiles"></div>`;
  MODES.forEach(m => {
    const b = document.createElement("button"); b.type = "button"; b.className = "tile";
    b.innerHTML = `<span class="ic" style="background:${m.color}">${svg(m.id)}</span><b>${m.name}</b><span>${m.sub}</span>`;
    b.addEventListener("click", () => start(m.id)); $("tiles").appendChild(b);
  });
  $("goSpeed").addEventListener("click", () => start("speed"));
  $("goRank").addEventListener("click", rankScreen);
  window.scrollTo(0, 0);
}
function start(id) { mode = id; combo = 0; if (id === "speed") startSpeed(); else RENDER[id](); window.scrollTo(0, 0); }
function shell(title, body) {
  $("app").innerHTML = `<section class="play pop"><div class="playtop"><button class="back" type="button" id="back" aria-label="Back to start">${svg("back")}</button>
    <span class="mode">${esc(title)}</span>${combo >= 2 ? `<span class="chip">${combo} in a row</span>` : ""}</div>${body}</section>`;
  $("back").addEventListener("click", home);
}

// ---------- question types ----------
function choice({ title, prompt, note, options, answer, en, explain, xp = 10, after }) {
  shell(title, `<p class="prompt">${esc(prompt)}</p>${note ? `<p class="note">${esc(note)}</p>` : ""}<div class="answers" id="ch"></div><div id="fb"></div><div class="spacer"></div><div class="row" id="nx"></div>`);
  shuffle(options).forEach(o => {
    const b = document.createElement("button"); b.type = "button"; b.className = "ans"; b.textContent = o;
    b.addEventListener("click", () => {
      const ok = o === answer;
      document.querySelectorAll(".ans").forEach(c => { c.disabled = true; if (c.textContent === answer) c.classList.add("right"); });
      if (!ok) { b.classList.add("wrong"); b.classList.add("shake"); }
      award(en, ok, after ? 2 : xp);
      if (after) after(ok); else feedback(ok, answer, explain, xp);
    });
    $("ch").appendChild(b);
  });
}
function typed({ title, prompt, note, answers, en, explain, hint, xp = 15 }) {
  shell(title, `<p class="prompt">${esc(prompt)}</p>${note ? `<p class="note">${esc(note)}</p>` : ""}
    <form class="row" id="f"><input class="inp" id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Your answer" placeholder="Type here">
    <button class="btn go" type="submit">Check</button><button class="btn" type="button" id="hint">Hint</button></form>
    <p class="note" id="ht" hidden></p><div id="fb"></div><div class="spacer"></div><div class="row" id="nx"></div>`);
  let h = 0; const main = answers[0];
  $("hint").addEventListener("click", () => { h++; $("ht").textContent = "Hint: " + (hint && h === 1 ? hint : main.slice(0, h + 1) + "…"); $("ht").hidden = false; $("inp").focus(); });
  $("f").addEventListener("submit", e => {
    e.preventDefault(); const v = norm($("inp").value); if (!v) return;
    const ok = answers.some(a => norm(a) === v);
    $("inp").disabled = true; $("f").querySelectorAll("button").forEach(b => b.disabled = true);
    if (!ok) $("inp").classList.add("shake");
    const gain = h ? Math.max(5, xp - 5 * h) : xp;
    award(en, ok, gain); feedback(ok, answers.join(" / "), explain, gain);
  });
  setTimeout(() => $("inp") && $("inp").focus(), 40);
}
function feedback(ok, answer, explain, xp) {
  $("fb").innerHTML = `<div class="fb ${ok ? "ok" : "no"} pop">${svg(ok ? "ok" : "no")}<div><b>${ok ? rnd(["Nice!", "Great!", "Yes!", "Correct!", "Well done!"]) : "Not quite."}</b>
    ${ok ? `<span class="xp">+${xp} XP</span>` : ` Answer: <b>${esc(answer)}</b>`}${explain ? `<div class="note">${esc(explain)}</div>` : ""}</div></div>`;
  $("nx").innerHTML = `<button class="btn go" type="button" id="go">Next</button>`;
  $("go").addEventListener("click", () => RENDER[mode]()); setTimeout(() => $("go") && $("go").focus(), 40);
}
function others(right, key, n = 3) { return shuffle(WORDS.filter(w => key(w) !== key(right))).slice(0, n).map(key); }

// ---------- modes ----------
const RENDER = {
  cards() {
    const w = pickWord(), en = st.dir === "en";
    shell("Flashcards", `<div class="row"><button class="btn small" type="button" id="dir">${en ? "English → German" : "German → English"}</button></div>
      <button class="flash" type="button" id="card" aria-label="Turn the card"><p class="prompt">${esc(en ? w.en : w.de)}</p><p class="note">Tap to turn</p></button>
      <div class="spacer"></div><div class="row" id="rate" hidden><span class="note">Did you know it? (practice only, no XP)</span><button class="btn yes" type="button" id="y">Yes</button><button class="btn no" type="button" id="n">Not yet</button></div>`);
    $("dir").addEventListener("click", () => { st.dir = en ? "de" : "en"; save(); RENDER.cards(); });
    $("card").addEventListener("click", () => {
      $("card").innerHTML = `<p class="prompt">${esc(en ? w.de : w.en)}</p><p class="note">${esc(w.def)}</p>${w.syn ? `<p class="note">synonym: ${esc(w.syn)}</p>` : ""}${w.opp ? `<p class="note">opposite: ${esc(w.opp)}</p>` : ""}<span class="speak" id="sp" role="button" aria-label="Listen">${svg("speaker")}</span>`;
      $("card").classList.add("pop"); $("rate").hidden = false;
      $("sp").addEventListener("click", ev => { ev.stopPropagation(); speak(w.en); });
      speak(w.en);
    }, { once: true });
    $("y").addEventListener("click", () => { award(w.en, true, 0, false); RENDER.cards(); });
    $("n").addEventListener("click", () => { award(w.en, false, 0, false); RENDER.cards(); });
  },
  quiz(after) {
    const w = pickWord(), k = rnd(["def", "de", "en"]);
    const base = { en: w.en, after, xp: 5, title: after ? "Speed round" : "Quiz" };
    if (k === "def") choice({ ...base, prompt: w.def, note: "What’s the word?", options: [w.en, ...others(w, x => x.en)], answer: w.en, explain: `${w.en} = ${w.de}` });
    else if (k === "de") choice({ ...base, prompt: w.de, note: "In English?", options: [w.en, ...others(w, x => x.en)], answer: w.en, explain: w.def });
    else choice({ ...base, prompt: w.en, note: "In German?", options: [w.de, ...others(w, x => x.de)], answer: w.de, explain: w.def });
  },
  type() {
    const w = pickWord(), de = Math.random() < 0.5;
    typed({ title: "Type it", prompt: de ? w.de : w.def, note: de ? "Write it in English. You don’t need sth. or sb." : "What’s the word? You don’t need sth. or sb.", answers: [w.en], en: w.en, explain: `${w.en} · ${w.de}` });
  },
  synant(after) {
    const w = pickWord(WORDS.filter(x => x.syn || x.opp)), syn = w.syn && (!w.opp || Math.random() < 0.5), ans = syn ? w.syn : w.opp;
    const opts = [ans, ...shuffle(WORDS.flatMap(x => [x.syn, x.opp]).filter(x => x && x !== ans)).slice(0, 3)];
    choice({ title: after ? "Speed round" : "Synonyms & opposites", after, xp: 8, prompt: `${syn ? "Same meaning as" : "Opposite of"} “${plain(w.en)}”`, note: syn ? "synonym" : "opposite", options: opts, answer: ans, en: w.en, explain: `${w.en} = ${w.de}` });
  },
  family() {
    const f = rnd(FAMILIES), end = { noun: "Typical endings: -ion, -th, -ment, -ance", adjective: "Typical endings: -al, -ous, -ful, -able, -ive" }[f[1]] || "";
    typed({ title: "Word families", xp: 20, prompt: `${f[0]} → ${f[1]}`, note: end, answers: f[2], en: f[3], hint: f[2][0].slice(0, 2) + "…", explain: `${f[0]} → ${f[2].join(" / ")}` });
  },
  coll(after) {
    const c = rnd(COLLS), verb = c[0].startsWith("___");
    const opts = [c[1], ...shuffle(COLLS.filter(x => x[1] !== c[1] && x[0].startsWith("___") === verb)).slice(0, 3).map(x => x[1])];
    choice({ title: after ? "Speed round" : "Collocations", after, xp: 8, prompt: c[0].replace("___", "……"), note: verb ? "Which verb fits?" : "Which word fits?", options: opts, answer: c[1], en: c[2], explain: c[0].replace("___", c[1]).replace(/\s*\(.*\)$/, "") });
  },
  gaps() {
    const s = rnd(SENTS), w = WORDS.find(x => x.en === s[2]);
    typed({ title: "Sentences", prompt: s[0].replace("___", "……"), note: w ? "German: " + w.de : "", answers: [s[1]], en: s[2], explain: s[0].replace("___", s[1]) });
  },
  list() {
    const col = ["var(--line)", "var(--sun)", "var(--sun)", "var(--lime)"], txt = ["new", "learning", "learning", "known"];
    shell("Word list", `<p class="note"><span class="dot" style="background:var(--lime)"></span>known <span class="dot" style="background:var(--sun);margin-left:10px"></span>learning <span class="dot" style="background:var(--line);margin-left:10px"></span>new</p>
      <div class="tablewrap"><table class="list"><tbody>${WORDS.map((w, i) => `<tr><td><span class="dot" style="background:${col[level(w)]}" title="${txt[level(w)]}"></span>${esc(w.en)}<div style="margin-top:6px"><button class="btn small" type="button" data-i="${i}" aria-label="Listen to ${esc(plain(w.en))}">${svg("speaker", 'width="18" height="18"')}</button></div></td><td>${esc(w.de)}<div class="note">${esc(w.def)}</div></td></tr>`).join("")}</tbody></table></div>`);
    document.querySelectorAll("[data-i]").forEach(b => b.addEventListener("click", () => speak(WORDS[+b.dataset.i].en)));
  }
};

// ---------- speed round ----------
function startSpeed() {
  speed = { left: 60, score: 0, t: null };
  speed.t = setInterval(() => { speed.left--; const bar = $("tbar"); if (bar) bar.style.width = (speed.left / 60 * 100) + "%"; const n = $("tleft"); if (n) n.textContent = speed.left; if (speed.left <= 0) endSpeed(); }, 1000);
  speedQ();
}
function speedQ() {
  if (!speed) return;
  rnd([RENDER.quiz, RENDER.quiz, RENDER.synant, RENDER.coll])(ok => { if (ok) speed.score++; setTimeout(speedQ, ok ? 350 : 900); });
  document.querySelector(".playtop").insertAdjacentHTML("beforeend", `<span class="chip"><span id="tleft">${speed.left}</span>s · ${speed.score}</span>`);
  document.querySelector(".playtop").insertAdjacentHTML("afterend", `<div class="timer"><i id="tbar" style="width:${speed.left / 60 * 100}%"></i></div>`);
}
function stopSpeed() { if (speed && speed.t) clearInterval(speed.t); speed = null; }
function endSpeed() {
  const score = speed.score, rec = score > st.best; stopSpeed();
  if (rec) { st.best = score; addXP(10); save(); confetti(); }
  shell("Speed round", `<div class="spacer"></div><p class="note center">Time is up!</p><div class="big">${score}</div><p class="note center">${rec ? "New record! +10 XP" : `Your record: ${st.best}`}</p><div class="spacer"></div>
    <div class="row" style="justify-content:center"><button class="btn go" type="button" id="again">Play again</button><button class="btn" type="button" id="home2">Back to start</button></div>`);
  $("again").addEventListener("click", () => start("speed")); $("home2").addEventListener("click", home);
}

// ---------- confetti ----------
function confetti() {
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("confetti"), cx = cv.getContext("2d"); cv.width = innerWidth; cv.height = innerHeight;
  const cols = ["#FF7A59", "#B8E86A", "#6EC8FF", "#FFC94D", "#B49BFF"];
  const ps = Array.from({ length: 90 }, () => ({ x: innerWidth / 2, y: innerHeight / 3, vx: (Math.random() - 0.5) * 12, vy: Math.random() * -10 - 3, s: 5 + Math.random() * 6, c: rnd(cols), r: Math.random() * 6 }));
  let f = 0; (function step() { cx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.35; p.r += 0.2; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6); cx.restore(); });
    if (++f < 90) requestAnimationFrame(step); else cx.clearRect(0, 0, cv.width, cv.height); })();
}

document.addEventListener("keydown", e => { if (e.key === "Enter" && $("go") && document.activeElement !== $("go") && document.activeElement.tagName !== "INPUT") { e.preventDefault(); $("go").click(); } });

function resetIdle() {
  $("resetBox").innerHTML = (me ? `<span class="who"><span>Signed in as <b>${esc(me.name)}</b></span><button class="btn small" type="button" id="so">Sign out</button></span>` : "") + `<span class="who">Progress is saved on this device.<button class="btn small" type="button" id="rs">Start again</button></span>`;
  if (me) $("so").addEventListener("click", signOut);
  $("rs").addEventListener("click", () => {
    $("resetBox").innerHTML = `Delete all your progress? <button class="btn small no" type="button" id="rsY">Yes, delete</button><button class="btn small" type="button" id="rsN">Cancel</button>`;
    $("rsY").addEventListener("click", () => { st = Object.assign(load(), { lvl: {}, xp: 0, best: 0, done: 0, days: 0, last: "", wk: "", wxp: 0 }); save(); resetIdle(); drawTop(); home(); });
    $("rsN").addEventListener("click", resetIdle);
  });
}

async function sha(s) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}
const normCode = s => String(s).toLowerCase().replace(/[\s\-_.]/g, "");
const slug = s => s.toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
function cleanName(s) {
  const m = String(s).replace(/\s+/g, " ").trim().match(/^(\S+)(?: (\S)\.?)?$/u);
  if (!m) return "";
  const first = m[1].split("-").map(p => p.charAt(0).toUpperCase() + p.slice(1).toLowerCase()).join("-");
  return first + (m[2] ? " " + m[2].toUpperCase() + "." : "");
}
const L = "a-zäöüßáàâãéèêëíìîïóòôõúùûçñ";
const NAME_RE = new RegExp(`^[${L.toUpperCase().replace("SS", "")}][${L}]{1,14}(-[${L.toUpperCase().replace("SS", "")}][${L}]{1,14})?( [A-ZÄÖÜ]\\.)?$`);
// blocked: insults, discrimination, sexual words, extremism. BAD_PART also matches inside a name, BAD_WORD only as the whole name part.
const BAD_PART = ["sex", "porn", "fick", "fuck", "fuk", "bitch", "slut", "whore", "milf", "horny", "boob", "tits", "titten", "pussy", "cunt", "dildo", "pimmel", "penis", "vagina", "muschi", "fotze", "schwanz", "wichs", "wixx", "wixer", "nutte", "hure", "schlampe", "bastard", "arsch", "scheiss", "scheiß", "bullshit", "shithead", "kacke", "pisse", "geil", "nackt", "naked", "nude", "onlyfans", "stripper",
  "nigg", "nigga", "neger", "negro", "kanake", "zigeuner", "schwuchtel", "faggot", "tranny", "transe", "spast", "behindert", "mongo", "retard", "missgeburt", "krüppel", "kruppel",
  "hitler", "heilhit", "judensau", "auschwitz", "holocaust", "nsdap", "taliban", "terror", "allahuakbar", "isis"];
const BAD_WORD = ["anal", "anus", "ass", "cum", "dick", "cock", "hoe", "shit", "tit", "gay", "homo", "lesbe", "fag", "jude", "nazi", "adolf", "heil", "ss", "kz", "opfer", "herr", "frau", "mr", "mrs", "ms", "miss", "sir", "lehrer", "teacher", "admin"];
const squash = s => s.replace(/(.)\1+/g, "$1");
const deleet = s => s.replace(/[0]/g, "o").replace(/[1!|]/g, "i").replace(/3/g, "e").replace(/[4@]/g, "a").replace(/[5$]/g, "s").replace(/7/g, "t");
function badName(n) {
  const low = deleet(String(n).toLowerCase());
  const joined = low.replace(/[^a-zäöüßáàâãéèêëíìîïóòôõúùûçñ]/g, "");
  const alt = joined.replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue");
  const vs = [joined, squash(joined), alt, squash(alt)];
  if (BAD_PART.some(b => vs.some(v => v.includes(b) || v.includes(squash(b))))) return true;
  const words = low.split(/[^a-zäöüßáàâãéèêëíìîïóòôõúùûçñ]+/).filter(Boolean);
  return words.some(w => BAD_WORD.includes(w) || BAD_WORD.includes(squash(w)));
}
function weekKey(d = new Date()) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day); const y = t.getUTCFullYear();
  return y + "-W" + Math.ceil(((t - Date.UTC(y, 0, 1)) / 864e5 + 1) / 7);
}
function addXP(n) { const wk = weekKey(); if (st.wk !== wk) { st.wk = wk; st.wxp = 0; } st.xp += n; st.wxp += n; }
function streakNow(u) { const y = new Date(); y.setDate(y.getDate() - 1); return (u.last === dayStr() || u.last === dayStr(y)) ? (u.days || 0) : 0; }

function getDb() {
  if (db) return db;
  if (typeof firebase === "undefined") return null;
  try { db = (firebase.apps.length ? firebase.app() : firebase.initializeApp(FB_CONFIG)).database(); } catch (e) { db = null; }
  return db;
}
function payload() {
  const wk = weekKey();
  return { name: me.name, xp: st.xp, best: st.best, days: st.days, last: st.last, wk: st.wk === wk ? wk : wk, wxp: st.wk === wk ? st.wxp : 0, lvl: null, lvlJ: JSON.stringify(st.lvl), t: Date.now() };
}
function scheduleSync() {
  if (!me) return;
  clearTimeout(syncT);
  syncT = setTimeout(flushSync, 1500);
}
let resetChecked = false;
function applyReset(r) {
  r = r || 0;
  if (r > (st.resetSeen || 0)) {
    Object.assign(st, { xp: 0, wxp: 0, best: 0, days: 0, last: "", resetSeen: r });
    try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {}
    drawTop(); if (mode === "home") home();
  }
  resetChecked = true;
}
async function checkReset() {
  const d = getDb(); if (!d) return;
  try { applyReset((await d.ref(ROOT + "/config/reset").get()).val()); } catch (e) {}
}
function watchReset() {
  const d = getDb(); if (!d) return;
  d.ref(ROOT + "/config/reset").on("value", s => { applyReset(s.val()); if (me) scheduleSync(); }, () => {});
}
function flushSync() {
  clearTimeout(syncT); syncT = null;
  if (!resetChecked) return;
  const d = getDb(); if (me && d) d.ref(ROOT + "/users/" + me.id).update(payload()).catch(() => {});
}
function merge(a, b) {
  const wk = weekKey(), out = Object.assign({}, a);
  out.xp = Math.max(a.xp || 0, b.xp || 0); out.best = Math.max(a.best || 0, b.best || 0);
  if ((b.last || "") && (!a.last || new Date(b.last) > new Date(a.last) || (b.last === a.last && (b.days || 0) > (a.days || 0)))) { out.last = b.last; out.days = b.days || 0; }
  const aw = a.wk === wk ? (a.wxp || 0) : 0, bw = b.wk === wk ? (b.wxp || 0) : 0;
  out.wk = wk; out.wxp = Math.max(aw, bw);
  out.lvl = Object.assign({}, a.lvl || {}); let bl = b.lvl || {}; try { if (b.lvlJ) bl = JSON.parse(b.lvlJ); } catch (e) {}
  Object.entries(bl).forEach(([k, v]) => { out.lvl[k] = Math.max(out.lvl[k] || 0, v); });
  return out;
}

  $("app").innerHTML = `<section class="play pop join">

async function doJoin() {
  const code = $("jCode").value, name = cleanName($("jName").value), pin = $("jPin").value.trim();
  const btn = $("go"); btn.disabled = true; btn.textContent = "One moment …";
  const fail = m => { const c = $("jCode").value, n = $("jName").value; joinScreen(m); $("jCode").value = c; $("jName").value = n; };
  if (await sha(normCode(code)) !== CLASS_HASH) return fail("Wrong class code. Ask your teacher.");
  if (!name || !NAME_RE.test(name)) return fail("Please enter only your real first name. You may add the first letter of your surname, e.g. “Lena K.”");
  if (badName(name)) return fail("This name is not allowed. Please use your real first name.");
  if (!/^\d{4}$/.test(pin)) return fail("Your PIN must have exactly 4 digits.");
  const d = getDb(); if (!d) return fail("No connection. Check your internet and try again.");
  const id = slug(name), ph = await sha(id + ":" + pin), ref = d.ref(ROOT + "/users/" + id);
  let snap;
  try { snap = (await ref.get()).val(); } catch (e) { return fail("The ranking is not reachable right now. Try again later."); }
  if (snap && snap.pin && snap.pin !== ph) return fail(`The name “${name}” is already taken and the PIN does not match. If this is not you, add the first letter of your surname, e.g. “${name.split(" ")[0]} K.”`);
  await checkReset();
  if (snap) st = merge(st, snap);
  me = { id, name: snap && snap.name ? snap.name : name };
  try { localStorage.setItem(ME_KEY, JSON.stringify(me)); } catch (e) {}
  try { await ref.update(Object.assign(payload(), { pin: ph })); } catch (e) { me = null; try { localStorage.removeItem(ME_KEY); } catch (x) {} return fail("Saving did not work. Try again later."); }
  save(); drawTop(); resetIdle(); confetti(); rankScreen();
}

// ---------- ranking ----------
const TABS = [
  { id: "xp", name: "Total XP", val: u => u.xp || 0, fmt: v => v + " XP" },
  { id: "week", name: "This week", val: u => u.wk === weekKey() ? (u.wxp || 0) : 0, fmt: v => v + " XP" },
  { id: "speed", name: "Speed", val: u => u.best || 0, fmt: v => v + " words" },
  { id: "streak", name: "Streak", val: u => streakNow(u), fmt: v => v + (v === 1 ? " day" : " days") }
];
function offRank() { if (rankRef) { rankRef.off(); rankRef = null; } }
function rankScreen() {
  if (!me && !teacher) return joinScreen();
  mode = "rank"; stopSpeed(); offRank();
  shell("Ranking", `<div class="tabs" role="tablist">${TABS.map(t => `<button type="button" role="tab" class="tab${t.id === rankTab ? " on" : ""}" data-t="${t.id}" aria-selected="${t.id === rankTab}">${t.name}</button>`).join("")}</div>
    <ol class="rank" id="rankList"><li class="note">Loading …</li></ol>
    <p class="note center" id="rankNote"></p>`);
  document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => { rankTab = b.dataset.t; document.querySelectorAll(".tab").forEach(x => { x.classList.toggle("on", x === b); x.setAttribute("aria-selected", x === b); }); drawRank(); }));
  const d = getDb(); if (!d) { $("rankList").innerHTML = `<li class="note">No connection. The ranking needs internet.</li>`; return; }
  scheduleSync();
  rankRef = d.ref(ROOT + "/users");
  rankRef.on("value", s => { rankData = s.val() || {}; drawRank(); }, () => { $("rankList").innerHTML = `<li class="note">The ranking is not reachable right now.</li>`; });
}
let rankData = {};
function drawRank() {
  const list = $("rankList"); if (!list) return;
  const t = TABS.find(x => x.id === rankTab);
  const rows = Object.entries(rankData).filter(([, u]) => u && u.name && (teacher || !badName(u.name))).map(([id, u]) => ({ id, name: u.name, v: t.val(u), u, bad: badName(u.name) }))
    .sort((a, b) => b.v - a.v || a.name.localeCompare(b.name));
  let place = 0, prev = null;
  list.innerHTML = rows.map((r, i) => {
    if (r.v !== prev) { place = i + 1; prev = r.v; }
    const medal = r.v > 0 && place <= 3 ? ` m${place}` : "";
    const tools = teacher ? `<span class="tt"><button class="btn small" type="button" data-pin="${esc(r.id)}">PIN reset</button><button class="btn small no" type="button" data-del="${esc(r.id)}">Delete</button></span>` : "";
    return `<li class="${me && r.id === me.id ? "me" : ""}"><span class="pl${medal}">${place}</span><span class="nm">${esc(r.name)}${r.bad ? " <small>(hidden: blocked name)</small>" : ""}${me && r.id === me.id ? " <small>(you)</small>" : ""}</span><span class="vl">${t.fmt(r.v)}</span>${tools}</li>`;
  }).join("") || `<li class="note">Nobody is here yet.</li>`;
  $("rankNote").textContent = rankTab === "week" ? "The weekly ranking starts again every Monday." : rankTab === "streak" ? "Days in a row with at least one right answer." : rankTab === "speed" ? "Best score in the 60-second speed round." : "All XP you have collected.";
  if (teacher) {
    list.querySelectorAll("[data-pin]").forEach(b => b.addEventListener("click", () => { getDb().ref(ROOT + "/users/" + b.dataset.pin + "/pin").remove(); b.textContent = "PIN removed"; b.disabled = true; }));
    list.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
      if (b.dataset.sure) getDb().ref(ROOT + "/users/" + b.dataset.del).remove(); else { b.dataset.sure = "1"; b.textContent = "Sure? Delete"; }
    }));
  }
}
